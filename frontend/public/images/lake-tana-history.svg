<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lake Tana Historical Timeline Illustration</title>
  <desc id="desc">Decorative timeline graphic showing four periods of Lake Tana history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="120" fill="#22d3ee" opacity="0.08"/>
  <circle cx="180" cy="620" r="160" fill="#34d399" opacity="0.10"/>

  <text x="80" y="110" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="44" font-weight="700">
    Lake Tana Historical Highlights
  </text>
  <text x="80" y="150" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">
    A simplified timeline for tourism learning content
  </text>

  <line x1="120" y1="360" x2="1080" y2="360" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <circle cx="180" cy="360" r="14" fill="#22d3ee"/>
    <rect x="100" y="220" width="180" height="110" rx="16" fill="#0b1220" stroke="#22d3ee"/>
    <text x="120" y="255" fill="#e2e8f0" font-size="20" font-weight="700">Ancient Era</text>
    <text x="120" y="286" fill="#94a3b8" font-size="16">Blue Nile source</text>

    <circle cx="420" cy="360" r="14" fill="#22d3ee"/>
    <rect x="330" y="395" width="190" height="118" rx="16" fill="#0b1220" stroke="#22d3ee"/>
    <text x="350" y="430" fill="#e2e8f0" font-size="18" font-weight="700">13th-16th c.</text>
    <text x="350" y="462" fill="#94a3b8" font-size="16">Monastic learning</text>
    <text x="350" y="484" fill="#94a3b8" font-size="16">and manuscripts</text>

    <circle cx="700" cy="360" r="14" fill="#34d399"/>
    <rect x="610" y="220" width="190" height="110" rx="16" fill="#0b1220" stroke="#34d399"/>
    <text x="630" y="255" fill="#e2e8f0" font-size="18" font-weight="700">17th-18th c.</text>
    <text x="630" y="286" fill="#94a3b8" font-size="16">Gondarine influence</text>

    <circle cx="960" cy="360" r="14" fill="#34d399"/>
    <rect x="860" y="395" width="220" height="118" rx="16" fill="#0b1220" stroke="#34d399"/>
    <text x="880" y="430" fill="#e2e8f0" font-size="18" font-weight="700">Modern Era</text>
    <text x="880" y="462" fill="#94a3b8" font-size="16">Conservation and</text>
    <text x="880" y="484" fill="#94a3b8" font-size="16">UNESCO recognition</text>
  </g>
</svg>
